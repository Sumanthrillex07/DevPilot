# ============================================================
# Local in-memory development profile (no Docker required)
# ============================================================
# Run with: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
# ============================================================

server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:devpilot_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false
    locations: classpath:db/migration

devpilot:
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
  # Stub values for local development — replace with real values to test OAuth2
  token-encryptor-password: local-dev-password
  token-encryptor-salt: "0a1b2c3d4e5f6789"

spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${DEVPILOT_GITHUB_CLIENT_ID:local-placeholder-id}
            client-secret: ${DEVPILOT_GITHUB_CLIENT_SECRET:local-placeholder-secret}
            scope: read:user,repo
